# Agent4Sci benchmark registry: project name -> container image (+ metadata).
# Images live on GHCR and are self-contained: on launch they download the
# train/val (hill-climb) or test (evaluate) split from HuggingFace.
# The 20 published Agent4Sci suite benchmarks, plus PFDelta_2000, the harder
# 2000-bus case-study variant from the paper (not part of the suite of 20).

ATAT:
  image: ghcr.io/maszhongming/agent4sci-atat:latest
  domain: Astronomy
  task: Transient classification
CarbonGlobe:
  image: ghcr.io/maszhongming/agent4sci-carbonglobe:latest
  domain: Ecology
  task: Carbon forecasting
CheMixHub:
  image: ghcr.io/maszhongming/agent4sci-chemixhub:latest
  domain: Chemistry
  task: Chemical-mixture property prediction
CosmoBench:
  image: ghcr.io/maszhongming/agent4sci-cosmobench:latest
  domain: Cosmology
  task: Cosmological parameter regression
DART-Eval:
  image: ghcr.io/maszhongming/agent4sci-dart-eval:latest
  domain: Genomics
  task: Regulatory-DNA chromatin-activity prediction
ESCAPE:
  image: ghcr.io/maszhongming/agent4sci-escape:latest
  domain: Bioengineering
  task: Antimicrobial-peptide classification
GEO-Bench-2:
